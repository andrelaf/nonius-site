<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" width="960" height="600" role="img" aria-labelledby="title desc">
  <title id="title">Nonius: one core, from server to pixel</title>
  <desc id="desc">A server built on nonius-server cuts a series into tiles with nonius-core and draws images with nonius-render. The tiles travel as NSB1 columns, read in place. In the browser the npm package runs the same nonius-core and nonius-render compiled to WebAssembly, and a worker follows a live feed with nonius-live. Natively, Rust programs use the crates directly, C and other languages use nonius-capi, and .NET uses the Nonius packages.</desc>
  <style>
    .bg { fill: #ffffff }
    .panel { fill: #f5f7fa; stroke: #d0d7de }
    .box { fill: #ffffff; stroke: #8c959f }
    .core { fill: #ddf4ff; stroke: #0969da }
    .band { fill: #ddf4ff; opacity: 0.6 }
    .head { fill: #1f2328; font: 600 15px system-ui, -apple-system, "Segoe UI", sans-serif }
    .name { fill: #1f2328; font: 600 13px system-ui, -apple-system, "Segoe UI", sans-serif }
    .sub { fill: #59636e; font: 12px ui-monospace, "SFMono-Regular", Consolas, monospace }
    .note { fill: #59636e; font: 12px system-ui, -apple-system, "Segoe UI", sans-serif }
    .wire { fill: #1f2328; font: 600 12px system-ui, -apple-system, "Segoe UI", sans-serif }
    .accent { fill: #0969da; font: 600 12px system-ui, -apple-system, "Segoe UI", sans-serif }
    .arrow { stroke: #59636e; stroke-width: 1.5; fill: none }
    .tip { fill: #59636e }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #0d1117 }
      .panel { fill: #161b22; stroke: #30363d }
      .box { fill: #0d1117; stroke: #6e7681 }
      .core { fill: #0c2d6b; stroke: #4493f8 }
      .band { fill: #0c2d6b }
      .head, .name, .wire { fill: #e6edf3 }
      .sub, .note { fill: #9198a1 }
      .accent { fill: #4493f8 }
      .arrow { stroke: #9198a1 }
      .tip { fill: #9198a1 }
    }
  </style>
  <defs>
    <marker id="tip" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path class="tip" d="M0,0 L10,5 L0,10 z"/>
    </marker>
  </defs>

  <rect class="bg" width="960" height="600"/>

  <!-- The core, the same code on both sides. -->
  <rect class="band" x="270" y="176" width="420" height="62" rx="8"/>

  <!-- The server. -->
  <rect class="panel" x="20" y="20" width="260" height="360" rx="10"/>
  <text class="head" x="40" y="50">Your server</text>
  <text class="sub" x="40" y="70">nonius-server, or your own</text>

  <rect class="box" x="40" y="90" width="220" height="62" rx="6"/>
  <text class="name" x="56" y="116">Your points, stored or live</text>
  <text class="sub" x="56" y="137">nonius-format · nonius-live</text>

  <rect class="core" x="40" y="176" width="220" height="62" rx="6"/>
  <text class="name" x="56" y="202">Pyramid, tiles, autoscale</text>
  <text class="sub" x="56" y="223">nonius-core</text>

  <rect class="box" x="40" y="262" width="220" height="62" rx="6"/>
  <text class="name" x="56" y="288">Images, on the CPU</text>
  <text class="sub" x="56" y="309">nonius-render</text>

  <text class="note" x="40" y="356">a live feed: your server, its codec</text>

  <!-- The browser. -->
  <rect class="panel" x="680" y="20" width="260" height="360" rx="10"/>
  <text class="head" x="700" y="50">Your page</text>
  <text class="sub" x="700" y="70">npm: nonius</text>

  <rect class="box" x="700" y="90" width="220" height="62" rx="6"/>
  <text class="name" x="716" y="116">Live feed, in a worker</text>
  <text class="sub" x="716" y="137">nonius-live → WASM</text>

  <rect class="core" x="700" y="176" width="220" height="62" rx="6"/>
  <text class="name" x="716" y="202">Pyramid, view, autoscale</text>
  <text class="sub" x="716" y="223">nonius-core → WASM</text>

  <rect class="box" x="700" y="262" width="220" height="62" rx="6"/>
  <text class="name" x="716" y="288">WebGPU, WebGL2, Canvas 2D</text>
  <text class="sub" x="716" y="309">nonius-render → WASM</text>

  <text class="note" x="700" y="356">axes, crosshair, legend: on the GPU</text>

  <!-- The wire. -->
  <text class="head" x="480" y="50" text-anchor="middle">On the wire</text>

  <path class="arrow" d="M262,121 H696" marker-end="url(#tip)"/>
  <text class="wire" x="480" y="112" text-anchor="middle">live: frames over a WebSocket</text>
  <text class="note" x="480" y="138" text-anchor="middle">numbered; a gap is found and recovered</text>

  <path class="arrow" d="M262,207 H696" marker-end="url(#tip)"/>
  <text class="wire" x="480" y="198" text-anchor="middle">tiles: NSB1 columns over HTTP</text>
  <text class="note" x="480" y="224" text-anchor="middle">Arrow layout, read in place, cacheable</text>
  <text class="accent" x="480" y="258" text-anchor="middle">one core on both sides: a tile cut</text>
  <text class="accent" x="480" y="274" text-anchor="middle">on the server is what the page draws</text>

  <path class="arrow" d="M262,300 H696" marker-end="url(#tip)"/>
  <text class="wire" x="480" y="319" text-anchor="middle">PNG: the pixels the page draws</text>
  <text class="note" x="480" y="335" text-anchor="middle">for anything that shows an image</text>

  <!-- Native. -->
  <rect class="panel" x="20" y="410" width="920" height="170" rx="10"/>
  <text class="head" x="40" y="440">Native: Rust, C, .NET</text>
  <text class="note" x="40" y="460">the same crates, linked; time is 64-bit nanoseconds everywhere</text>

  <rect class="core" x="40" y="480" width="280" height="76" rx="6"/>
  <text class="name" x="56" y="506">Your Rust program</text>
  <text class="sub" x="56" y="527">nonius-core, nonius-render</text>
  <text class="sub" x="56" y="545">on wgpu, or the CPU alone</text>

  <rect class="box" x="340" y="480" width="280" height="76" rx="6"/>
  <text class="name" x="356" y="506">C, and anything that calls C</text>
  <text class="sub" x="356" y="527">nonius-capi · nonius.h</text>
  <text class="sub" x="356" y="545">series, images, a chart on the CPU</text>

  <rect class="box" x="640" y="480" width="280" height="76" rx="6"/>
  <text class="name" x="656" y="506">.NET</text>
  <text class="sub" x="656" y="527">Nonius · Nonius.Avalonia</text>
  <text class="sub" x="656" y="545">Nonius.Blazor (the npm package)</text>
</svg>
